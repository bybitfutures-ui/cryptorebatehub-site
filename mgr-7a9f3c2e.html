let NET_OFFSET=0,NET_OK=false,NET_LAST=0,NET_SRC='',LAST_DAY=null;
async function syncTime(silent){
  const sources=[{n:'OKX',u:'https://www.okx.com/api/v5/public/time',p:r=>parseInt(r.data?.[0]?.ts)},{n:'WorldTime',u:'https://worldtimeapi.org/api/timezone/Etc/UTC',p:r=>new Date(r.utc_datetime).getTime()}];
  for(const src of sources){
    try{
      const t0=Date.now();
      const r=await fetch(src.u,{cache:'no-store'});
      if(!r.ok)continue;
      const d=await r.json();
      const ms=src.p(d);
      if(!ms||isNaN(ms))continue;
      NET_OFFSET=ms+(Date.now()-t0)/2-Date.now();
      NET_OK=true;NET_LAST=Date.now();NET_SRC=src.n;
      updClock();
      if(!silent)tst('✓ 已同步 ('+src.n+')');
      return true;
    }catch(e){}
  }
  NET_OK=false;updClock();
  if(!silent)tst('⚠️ 同步失败，使用本地时间',1);
  return false;
}
function netNow(){return new Date(Date.now()+NET_OFFSET)}
function netDay(){const d=netNow();return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate()}
function netToday(){return netNow().toISOString().slice(0,10)}
function fmtT(d){return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+':'+String(d.getUTCSeconds()).padStart(2,'0')+' UTC'}
function updClock(){
  const el=$('#clk-dis');if(!el)return;
  const n=netNow();
  const badge=NET_OK?'<span style="color:var(--grn)">● '+NET_SRC+'</span>':'<span style="color:var(--yel)">● 本地</span>';
  const age=NET_LAST?Math.round((Date.now()-NET_LAST)/1000):0;
  el.innerHTML=fmtT(n)+' · '+badge+(NET_LAST?' · '+(age<60?age+'s':Math.round(age/60)+'m')+'前同步':'');
}

function checkScheduled(){
  const nowMs=netNow().getTime();
  let published=0,publishedTitles=[];
  for(const a of D.arts){
    if(a.scheduledAt&&!a.pub){
      const t=new Date(a.scheduledAt).getTime();
      if(!isNaN(t)&&t<=nowMs){
        a.pub=1;
        a.scheduledAt=null;
        // Set date to today if not set or is in the future relative to now
        const today=netToday();
        if(!a.date||a.date>today)a.date=today;
        published++;
        publishedTitles.push(a.title?.zh||a.title?.en||'(无标题)');
      }
    }
  }
  if(published){
    sv(true);
    tst('⏰ 定时发布：已发布 '+published+' 篇 ['+publishedTitles.slice(0,2).join('、')+(publishedTitles.length>2?' 等':'')+']');
    if(AL)scheduleRender();
  }
}

function autoSlug(){
  const en=$('#ed-title-en').value.trim();const zh=$('#ed-title-zh').value.trim();
  let src=en||zh;if(!src){tst('请先填写英文或中文标题',1);return}
  let slug=src.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  if(!slug||/^[\d-]+$/.test(slug)){tst('标题为空时无法生成',1);return}
  if(slug.length>60)slug=slug.slice(0,60).replace(/-[^-]*$/,'');
  $('#ed-slug').value=slug;tst('✓ 已生成 slug');
}

async function svArt(id){
  const ls=['zh','zh-TW','en','ko'];
  let slug=$('#ed-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  if(slug){const dup=D.arts.find(x=>x.id!==id&&x.slug===slug);if(dup){tst('Slug 已被「'+(dup.title?.zh||dup.title?.en)+'」占用',1);return}}
  const inputDate=$('#ed-date').value.trim();
  const status=document.querySelector('input[name="ed-status"]:checked')?.value||'0';
  const today=netToday();
  // Build base article
  const data={id,slug,date:inputDate,cat:$('#ed-cat').value,featured:$('#ed-ft').checked?1:0,title:{},exc:{},tag:{},cnt:{}};
  // Handle 3 states
  if(status==='2'){
    // Scheduled publishing
    const schedRaw=$('#ed-sched').value.trim();
    if(!schedRaw){tst('请选择定时发布时间',1);return}
    // Convert local datetime-local to UTC ISO string for storage
    const schedDate=new Date(schedRaw);
    if(isNaN(schedDate.getTime())){tst('定时发布时间无效',1);return}
    const nowMs=netNow().getTime();
    if(schedDate.getTime()<=nowMs){
      if(!confirm('⚠️ 定时发布时间已过。要立即发布吗？'))return;
      data.pub=1;data.scheduledAt=null;
    }else{
      data.pub=0;
      data.scheduledAt=schedDate.toISOString();
      // Use scheduled date as article date if input date is empty
      if(!data.date)data.date=schedDate.toISOString().slice(0,10);
    }
  }else if(status==='1'){
    data.pub=1;data.scheduledAt=null;
    if(!data.date)data.date=today;
    if(data.date>today){
      if(!confirm('⚠️ 文章日期 '+data.date+' 晚于今天。\n网站不会显示未来日期文章。是否仍立即发布？'))return;
    }
  }else{
    data.pub=0;data.scheduledAt=null;
  }
  ls.forEach(l=>{data.title[l]=$('#ed-title-'+l).value.trim();data.exc[l]=$('#ed-exc-'+l).value.trim();data.tag[l]=$('#ed-tag-'+l).value.trim();data.cnt[l]=$('#ed-cnt-'+l).value});
  if(!data.title.zh&&!data.title.en){tst('至少填写一种语言的标题',1);return}
  if(!data.slug){const en=data.title.en;if(en)data.slug=en.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,60);if(!data.slug)data.slug='article-'+id}
  if(D.autoTL&&data.title.zh){
    const btn=document.querySelector('[data-shortcut="save"]');if(btn){btn.disabled=true;btn.innerHTML='⏳ 翻译中...'}
    try{
      for(const tgt of ['zh-TW','en','ko']){
        if(data.title.zh&&!data.title[tgt])data.title[tgt]=await tl(data.title.zh,'zh',tgt);
        if(data.exc.zh&&!data.exc[tgt])data.exc[tgt]=await tl(data.exc.zh,'zh',tgt);
        if(data.tag.zh&&!data.tag[tgt])data.tag[tgt]=await tl(data.tag.zh,'zh',tgt);
        // Translate body — uses tlChunk for paragraph-by-paragraph (handles long markdown)
        if(data.cnt.zh&&!data.cnt[tgt]){
          if(btn)btn.innerHTML='⏳ 翻译正文 → '+tgt+'...';
          data.cnt[tgt]=await tlChunk(data.cnt.zh,'zh',tgt);
        }
      }
    }catch(e){tst('部分翻译失败',1)}
    if(btn){btn.disabled=false;btn.innerHTML='💾 保存文章'}
  }
  const idx=D.arts.findIndex(x=>x.id===id);
  if(idx>=0)D.arts[idx]=data;else D.arts.unshift(data);
  sv();go('arts');tst('✓ 已保存 · slug: '+data.slug);
}
async function tl(text,src,tgt){
  if(!text||src===tgt)return text;
  const tgtMap={zh:'zh-CN','zh-TW':'zh-TW',en:'en',ko:'ko'};
  try{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+(tgtMap[src]||src)+'&tl='+(tgtMap[tgt]||tgt)+'&dt=t&q='+encodeURIComponent(text));const d=await r.json();return d[0].map(x=>x[0]).join('')}
  catch(e){try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+tgtMap[src]+'|'+tgtMap[tgt]);const d=await r.json();return d.responseData?.translatedText||text}catch(e2){return text}}
}

function bulkAddMirs(i){
  const example='# 格式（每行一条，支持以下三种）：\n# URL\n# URL,REGION\n# URL,REGION,LABEL\n#\n# 例子（请先删除上方注释行）：\nhttps://www.okx.com,GLOBAL,OKX 全球\nhttps://www.ouyi.cn,CN,欧易国内备用';
  const txt=prompt('粘贴备用网址（每行一条，可选 URL,REGION,LABEL 格式）：',example);
  if(!txt||txt===example)return;
  if(!D.exs[i].mirrors)D.exs[i].mirrors=[];
  let added=0;
  txt.split(/\r?\n/).forEach(line=>{
    line=line.trim();
    if(!line||line.startsWith('#'))return;
    const parts=line.split(',').map(s=>s.trim());
    const url=parts[0];
    if(!url||!/^https?:\/\//.test(url)){console.warn('Skip invalid URL:',url);return}
    const region=(parts[1]||'GLOBAL').toUpperCase();
    const validRegions=['GLOBAL','CN','HK','TW','JP','KR','SG','EU','US'];
    const finalRegion=validRegions.includes(region)?region:'GLOBAL';
    const label=parts[2]||'';
    D.exs[i].mirrors.push({
      url,region:finalRegion,
      label:{zh:label,'zh-TW':label,en:label,ko:label},
      note:{zh:'','zh-TW':'',en:'',ko:''}
    });
    added++;
  });
  if(added>0){
    sv();scheduleRender();tst('✓ 批量添加 '+added+' 个备用网址');
  }else{
    tst('未识别到有效的 URL（必须以 http:// 或 https:// 开头）',1);
  }
}

async function tlChunk(text,src,tgt){
  if(!text||src===tgt)return text;
  // Split very long text into chunks of ~3000 chars at paragraph boundaries
  const MAX=3000;
  if(text.length<=MAX)return await tl(text,src,tgt);
  // Split by double newline (paragraphs)
  const parts=text.split(/\n\n+/);
  let chunks=[],buf='';
  for(const p of parts){
    if((buf+p).length>MAX&&buf){chunks.push(buf);buf=p}
    else{buf+=(buf?'\n\n':'')+p}
  }
  if(buf)chunks.push(buf);
  const translated=[];
  for(const c of chunks){
    try{translated.push(await tl(c,src,tgt))}
    catch(e){translated.push(c)}
    await new Promise(r=>setTimeout(r,200)); // gentle rate limit
  }
  return translated.join('\n\n');
}

    for(const lng of langs){
      for(const f of fields){
        if(a[f]?.zh&&!a[f][lng])total++;
      }
    }
  }
  if(prog)prog.innerHTML='准备翻译 '+total+' 个字段...';
  for(const a of D.arts){
    if(!a.title?.zh)continue;
    for(const lng of langs){
      for(const f of fields){
        if(!a[f]?.zh)continue;
        if(a[f][lng])continue; // skip already translated
        try{
          const result=f==='cnt'?await tlChunk(a[f].zh,'zh',lng):await tl(a[f].zh,'zh',lng);
          if(result&&result!==a[f].zh){
            a[f][lng]=result;
            done++;
          }else{failed++}
        }catch(e){failed++;console.warn('Translate fail:',e)}
        if(prog)prog.innerHTML=`进度：<strong>${done+failed}/${total}</strong> · 成功 ${done} · 失败 ${failed} · 当前：${a.title.zh.slice(0,30)}... → ${lng}`;
        if((done+failed)%10===0)sv(true); // periodic save
      }
    }
  }
  sv(true);
  BT_RUNNING=false;
  if(btn){btn.disabled=false;btn.innerHTML='🌐 一键翻译所有文章到 4 语言'}
  if(prog)prog.innerHTML=`✅ 完成！成功翻译 <strong>${done}</strong> 个字段，失败 <strong>${failed}</strong> 个。`;
  tst(`✓ 翻译完成 · ${done} 成功 · ${failed} 失败`);
  setTimeout(()=>scheduleRender(),2000);
}

function getAdminKey(){
  let k = sessionStorage.getItem('crh_admin_key');
  if(!k){
    k = prompt('请输入 Admin API Key（管理订阅需要）:\n\n首次部署时在 Cloudflare Pages 项目中设置环境变量 ADMIN_KEY。');
    if(!k) return null;
    sessionStorage.setItem('crh_admin_key', k);
  }
  return k;
}

async function newsApi(path, method='GET', body){
  const key = getAdminKey();
  if(!key){ tst('⚠ 未输入 Admin Key，操作取消'); return null; }
  try {
    const r = await fetch(path, {
      method,
      headers: {'X-Admin-Key': key, 'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : undefined
    });
    if(r.status === 401){
      sessionStorage.removeItem('crh_admin_key');
      tst('⚠ Admin Key 错误，请重新输入');
      return null;
    }
    if(r.status === 503){
      tst('⚠ 数据库未配置。请先在 Cloudflare 创建 D1 并绑定（参见 db/README.md）');
      return null;
    }
    return await r.json();
  } catch(e){
    tst('⚠ 请求失败：' + e.message);
    return null;
  }
}

function newsCopyUnsub(token){
  const url = location.origin + '/u/' + token;

}

function newsExportCSV(status){
  const key = getAdminKey();
  if(!key) return;
  // We can't add header to <a href>, so use fetch + blob
  fetch('/api/admin/export'+(status?'?status='+status:''), {headers:{'X-Admin-Key':key}})
    .then(r => r.ok ? r.blob() : Promise.reject(r.status))
    .then(blob => {
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u;
      a.download = 'crh-subscribers-'+(status||'all')+'-'+new Date().toISOString().slice(0,10)+'.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(u), 2000);
      tst('✓ CSV 已下载');
    })
    .catch(s => tst('⚠ 导出失败 ('+s+')'));
}

async function campSaveField(field, value){
  if(!_campState.current) return;
  const r = await newsApi('/api/admin/campaigns/' + _campState.current.id, 'PATCH', {[field]: value});
  if(r && r.ok){
    _campState.current[field] = value;
    // Re-fetch full preview to update recipient counts (debounced)
    clearTimeout(_campState._t);
    _campState._t = setTimeout(async () => {
      const r2 = await newsApi('/api/admin/campaigns/' + _campState.current.id);
      if(r2 && r2.ok){ _campState.current = r2.campaign; _campState.preview = r2.preview; campRenderEdit(); }
    }, 600);
  }
}

async function campStartSend(){

  const msg = '即将向 ' + p.willReceive + ' 个订阅者发送邮件（已确认 active 状态）。\n\n' +
              (p.willSkip>0 ? '将跳过 ' + p.willSkip + ' 个（无对应语言版本）\n' : '') +
              '\n确认开始？';
  if(!confirm(msg)) return;
  await campSendBatch();

async function campContinueSend(){ await campSendBatch(); }

async function campSendBatch(){
  _campState.sending = true;
  campRenderEdit();
  const progressEl = document.getElementById('campProgress');
  let totalSent = 0, totalFailed = 0, totalSkipped = 0, remaining = -1, iter = 0;
  while(true){
    iter++;
    if(progressEl){
      progressEl.innerHTML = '<div style="font-size:13px;color:var(--tx2)">🚀 第 '+iter+' 批发送中…</div>' +
        '<div style="margin-top:10px;font-family:\'JetBrains Mono\',monospace;font-size:13px"><span style="color:var(--grn)">✓ '+totalSent+'</span> · <span style="color:#f6536a">✗ '+totalFailed+'</span> · <span style="color:var(--tx3)">⊘ '+totalSkipped+'</span>'+(remaining>=0?' · 剩余 ~'+remaining:'')+'</div>';
    }
    const r = await newsApi('/api/admin/campaigns/' + _campState.current.id + '/send', 'POST', {batchSize: 25});
    if(!r || !r.ok){
      if(progressEl) progressEl.innerHTML = '<div style="color:#f6536a;font-weight:700">⚠ 发送失败：' + (r && (r.detail || r.error || r.message) || '未知错误') + '</div>';
      _campState.sending = false;
      // Re-fetch to refresh status
      const r2 = await newsApi('/api/admin/campaigns/' + _campState.current.id);
      if(r2 && r2.ok){ _campState.current = r2.campaign; _campState.preview = r2.preview; campRenderEdit(); }
      return;
    }
    totalSent += r.batch.sent;
    totalFailed += r.batch.failed;
    totalSkipped += r.batch.skipped;
    remaining = r.remaining;
    if(r.finished || r.remaining === 0) break;
    // Small breather between batches
    await new Promise(res => setTimeout(res, 200));
    // Safety: max 100 iterations (= 2500 emails per click) to prevent infinite loop
    if(iter > 100){
      if(progressEl) progressEl.innerHTML += '<div style="color:var(--tx3);margin-top:10px;font-size:12px">已发送 2500 封，请点「继续发送」继续剩余。</div>';
      break;
    }
  }
  _campState.sending = false;
  if(progressEl){
    progressEl.innerHTML = '<div style="font-size:15px;color:var(--grn);font-weight:700;margin-bottom:8px">✓ 本次发送完成</div>' +
      '<div style="font-family:\'JetBrains Mono\',monospace;font-size:13.5px;color:var(--tx2)"><span style="color:var(--grn)">已发送: '+totalSent+'</span> · <span style="color:#f6536a">失败: '+totalFailed+'</span> · <span style="color:var(--tx3)">跳过: '+totalSkipped+'</span>'+(remaining>0?' · 剩余: '+remaining:'')+'</div>';
  }
  // Refresh campaign state
  const r3 = await newsApi('/api/admin/campaigns/' + _campState.current.id);
  if(r3 && r3.ok){ _campState.current = r3.campaign; _campState.preview = r3.preview; }
}

    prio: a.featured ? '0.85' : '0.75'
  }));

  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"\n        xmlns:xhtml="http://www.w3.org/1999/xhtml">\n';
  staticPages.forEach(sp=>{
    const url = `${DOMAIN}/${sp.p}`;
    xml += `  <url>\n    <loc>${url}</loc>\n    <lastmod>${today}</lastmod>\n    <changefreq>${sp.freq}</changefreq>\n    <priority>${sp.prio}</priority>\n`;
    langs.forEach(hl=>{ xml += `    <xhtml:link rel="alternate" hreflang="${hl}" href="${url}"/>\n` });
    xml += `    <xhtml:link rel="alternate" hreflang="x-default" href="${url}"/>\n  </url>\n`;
  });
  arts.forEach(a=>{
    const url = `${DOMAIN}/${a.p}`;
    xml += `  <url>\n    <loc>${url}</loc>\n    <lastmod>${a.date}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>${a.prio}</priority>\n`;
    langs.forEach(hl=>{ xml += `    <xhtml:link rel="alternate" hreflang="${hl}" href="${url}"/>\n` });
    xml += `    <xhtml:link rel="alternate" hreflang="x-default" href="${url}"/>\n  </url>\n`;
  });
  xml += '</urlset>\n';

  const b = new Blob([xml], {type:'application/xml'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = 'sitemap.xml'; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 2000);
  tst('✓ sitemap.xml 已下载 ('+(staticPages.length+arts.length)+' URLs)');
}
function impD(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{const j=JSON.parse(e.target.result);if(!j.exs||!j.coins){tst('文件格式不对',1);return}if(!confirm('确定导入？将覆盖当前数据。'))return;D=Object.assign(JSON.parse(JSON.stringify(DF)),j);sv();render();tst('✓ 导入成功')}catch(e){tst('JSON 解析失败：'+e.message,1)}};r.readAsText(f)}
async function loadDefault(){
  if(!confirm('从 articles.json 重新加载文章？现有同 ID 文章会保留（不覆盖）。'))return;
  try{
    const r=await fetch('articles.json',{cache:'no-store'});
    if(!r.ok)throw new Error('文件不存在');
    const arts=await r.json();
    arts.forEach(a=>{if(a.pub===undefined)a.pub=1});
    const ids=new Set(D.arts.map(a=>a.id));let added=0;
    arts.forEach(a=>{if(!ids.has(a.id)){D.arts.push(a);added++}});
    sv();render();tst('✓ 加载完成，新增 '+added+' 篇 · 共 '+D.arts.length+' 篇');
  }catch(e){tst('加载失败：'+e.message,1)}
}
function auditYears(){
  const Y=netNow().getUTCFullYear();
  if(!confirm('将所有文章中 '+Y+' 之前的年份引用替换为 {YEAR} 占位符？\n\n这些位置会自动显示当前年份。日期字段和 slug 不会修改。\n\n操作前建议先导出 JSON 备份。'))return;
  let count=0;
  D.arts.forEach(a=>{
    ['title','exc','tag','cnt'].forEach(f=>{
      if(!a[f])return;
      Object.keys(a[f]).forEach(l=>{
        const v=a[f][l];if(typeof v!=='string')return;
        const newV=v.replace(/(?<!\d)(\d{4})(?!\d)/g,(m,yr)=>{
          const n=+yr;
          if(n>=2020&&n<Y){count++;return'{YEAR}'}
          return m;
        });
        if(newV!==v)a[f][l]=newV;
      });
    });
  });
  if(count===0){tst('未发现需要替换的年份',1);return}
  sv();render();tst('✓ 已替换 '+count+' 处年份引用为 {YEAR}');
}
function fixFutureDates(){
  const today=netToday();let n=0;
  D.arts.forEach(a=>{if(a.date&&a.date>today){a.date=today;n++}});
  if(!n){tst('无需修正',1);return}
  sv();render();tst('✓ '+n+' 篇文章日期已修正为 '+today);
}
function clearAll(){if(!confirm('确定清空所有数据并恢复默认？此操作不可撤销！'))return;if(!confirm('再次确认：所有自定义文章、交易所、币种、链接都会丢失。继续吗？'))return;localStorage.removeItem('crh_d');location.reload()}

function rSettings(){
  let html=rTopBar('网站设置','管理密码 · 翻译开关');
  html+='<div class="pn"><div class="pn-h"><h2>🔐 修改管理密码</h2></div><div class="tip warn">⚠ 默认密码 <code>admin888</code> 必须立即修改。<br>要求：至少 <strong>8 位</strong>，必须包含字母和数字。</div><div class="row2"><div class="r"><label>新密码</label><input type="password" id="newpwd1" placeholder="至少 8 位 + 字母 + 数字"></div><div class="r"><label>再次确认</label><input type="password" id="newpwd2" placeholder="重复一次"></div></div><button class="b b-g" onclick="changePwd()">💾 更新密码</button></div>';
  html+='<div class="pn"><div class="pn-h"><h2>🌐 自动翻译</h2></div><div class="tip">💡 开启后，保存文章时若其他语言为空，会自动调用 Google Translate / MyMemory 填补。免费 API，可能限速，建议保存后人工校对。</div><label class="cb" style="font-size:14px;font-weight:600"><input type="checkbox" id="autoTL"'+(D.autoTL?' checked':'')+' onchange="D.autoTL=this.checked?1:0;sv();tst(this.checked?\'✓ 已启用自动翻译\':\'✓ 已关闭自动翻译\')"> 保存文章时自动翻译到其他 3 种语言</label></div>';
  html+='<div class="pn"><div class="pn-h"><h2>📊 系统信息</h2></div><table style="width:100%;font-size:13px"><tr><td style="padding:6px 0;color:var(--tx3);width:40%">后台版本</td><td>v2 · 多页面架构</td></tr><tr><td style="padding:6px 0;color:var(--tx3)">网络时间源</td><td>'+(NET_OK?NET_SRC+' ✓':'本地时间')+'</td></tr><tr><td style="padding:6px 0;color:var(--tx3)">当前年份</td><td>'+netNow().getUTCFullYear()+'（自动跟随）</td></tr><tr><td style="padding:6px 0;color:var(--tx3)">数据存储</td><td>localStorage · key <code>crh_d</code></td></tr><tr><td style="padding:6px 0;color:var(--tx3)">数据大小</td><td>'+(JSON.stringify(D).length/1024).toFixed(1)+' KB / 5 MB</td></tr></table></div>';
  return html;
}
function changePwd(){
  const p1=$('#newpwd1').value;
  const p2=$('#newpwd2').value;
  if(p1.length<8){tst('密码至少 8 位',1);return}
  if(p1==='admin888'){tst('请勿使用默认密码',1);return}
  if(!/[A-Za-z]/.test(p1)||!/[0-9]/.test(p1)){tst('密码应包含字母和数字',1);return}
  if(p1!==p2){tst('两次输入不一致',1);return}
  localStorage.setItem('crh_pwd',p1);
  localStorage.removeItem('crh_fails');
  localStorage.removeItem('crh_lock');
  $('#newpwd1').value='';
  $('#newpwd2').value='';
  tst('✓ 密码已更新');
}

function showHelp(){
  let bd=$('#helpBd');
  if(!bd){bd=document.createElement('div');bd.id='helpBd';bd.className='mb';bd.onclick=e=>{if(e.target===bd)bd.classList.remove('sh')};document.body.appendChild(bd)}
  bd.innerHTML='<div class="mx"><h2>⌨ 键盘快捷键</h2><table><tr><td style="width:38%"><kbd>N</kbd></td><td>新建文章</td></tr><tr><td><kbd>/</kbd></td><td>聚焦搜索框</td></tr><tr><td><kbd>Ctrl/⌘</kbd>+<kbd>S</kbd></td><td>保存当前文章</td></tr><tr><td><kbd>Ctrl/⌘</kbd>+<kbd>B</kbd></td><td>导出备份</td></tr><tr><td><kbd>Esc</kbd></td><td>返回列表 / 关闭弹窗</td></tr><tr><td><kbd>?</kbd></td><td>显示此帮助</td></tr></table><h2 style="margin-top:18px">⏰ 定时发布</h2><p style="font-size:13px;color:var(--tx2);line-height:1.7">编辑文章时选「定时发布」并设置具体时间。后台每 60 秒自动检查，到时间后会自动从「定时」转为「已发布」状态。访客打开网站时也会自动检查（即使后台没开）。</p><h2 style="margin-top:18px">💡 使用提示</h2><p style="font-size:13px;color:var(--tx2);line-height:1.7">· 文章正文用 <code>{YEAR}</code> 占位符自动跟随实际年份<br>· 网络时间每 30 分钟同步、每 60 秒检查日期变化<br>· 跨年时全站自动重新渲染显示新年份<br>· 未来日期文章不会在网站显示<br>· 建议每周导出 JSON 备份<br>· localStorage 容量约 5MB</p><div style="margin-top:18px;text-align:right"><button class="b b-o" onclick="$(\'#helpBd\').classList.remove(\'sh\')">关闭</button></div></div>';
  bd.classList.add('sh');
}

function logout(){if(!confirm('确定退出登录？'))return;sessionStorage.removeItem('crh_auth');AL=false;location.hash='';render()}

let RENDER_PENDING=false;
function scheduleRender(){
  if(RENDER_PENDING)return;
  RENDER_PENDING=true;
  requestAnimationFrame(()=>{RENDER_PENDING=false;render()});
}
function render(){
  if(!AL){$('#app').innerHTML=rLogin();return}
  const r=gr();
  let content='';
  switch(r.p){
    case'dash':content=rDash();break;
    case'arts':content=rArticles();break;
    case'cex':content=rExs('cex');break;
    case'dex':content=rExs('dex');break;
    case'wallets':content=rExs('wallet');break;
    case'exs':content=rExs();break; // legacy, shows all
    case'access':content=rAccess();break;
    case'news':content=rNews();break;
    case'camp':content=rCampList();break;
    case'campedit':content=rCampEdit(r.id);break;
    case'coins':content=rCoins();break;
    case'links':content=rLinks();break;
    case'data':content=rDataPage();break;
    case'settings':content=rSettings();break;
    default:content=rDash();
  }
  $('#app').innerHTML=rLayout(content);
  updClock();
  window.scrollTo(0,0);
}

render();
syncTime(1);
checkScheduled();
