.nv-in{padding:14px 24px;display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:0 auto;gap:14px}
.lg{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.lg-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--grn),var(--grn2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--bg);font-family:'Inter',sans-serif}
.lg-t{font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.lg-t em{font-style:normal;color:var(--grn)}
.nl{display:flex;list-style:none;gap:6px;font-size:14px;flex:1;justify-content:center}
.nl a{padding:8px 14px;border-radius:8px;color:var(--tx2);transition:.2s;cursor:pointer;white-space:nowrap}
.nl a:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.lng{display:flex;gap:4px;font-size:13px;flex-shrink:0}
.lng a{padding:6px 10px;border-radius:6px;color:var(--tx2);cursor:pointer}
.lng a:hover,.lng a.ac{background:var(--grnA);color:var(--grn)}
/* Hamburger button — animates to X when open */
.mb-tg{display:none;background:none;border:none;color:var(--tx);cursor:pointer;padding:8px;width:36px;height:36px;position:relative;z-index:51;align-items:center;justify-content:center}
.mb-tg .hb-line{display:block;width:22px;height:2px;background:currentColor;border-radius:2px;transition:.3s;position:relative}
.mb-tg .hb-line::before,.mb-tg .hb-line::after{content:'';position:absolute;left:0;width:22px;height:2px;background:currentColor;border-radius:2px;transition:.3s}
.mb-tg .hb-line::before{top:-7px}
.mb-tg .hb-line::after{top:7px}
.mb-tg.opn .hb-line{background:transparent}
.mb-tg.opn .hb-line::before{top:0;transform:rotate(45deg)}
.mb-tg.opn .hb-line::after{top:0;transform:rotate(-45deg)}
/* Mobile menu backdrop */
.nv-bd{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:47}
.nv-bd.sh{opacity:1;pointer-events:auto}
@media(max-width:900px){
  .nl{position:fixed;top:0;right:-100%;height:100vh;width:84%;max-width:340px;background:var(--bg);flex-direction:column;justify-content:flex-start;padding:80px 18px 24px;transition:right .3s ease;border-left:1px solid var(--bd);z-index:48;box-shadow:-12px 0 40px rgba(0,0,0,.4);overflow-y:auto}
  .nl.opn{right:0}
  .nl a{display:block;padding:14px 18px;font-size:16px;border-radius:10px;margin-bottom:4px;font-weight:500}
  .nl a:hover,.nl a.cur{background:var(--grnA);color:var(--grn)}
  .mb-tg{display:flex}
  .lng{position:fixed;top:-9999px;left:-9999px}
  .nl.opn ~ .lng-mobile-display{display:flex !important}
  .lng-mobile-display{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);gap:8px;z-index:49;flex-wrap:wrap;justify-content:center;background:var(--bg2);padding:10px 14px;border-radius:99px;border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .lng-mobile-display a{padding:7px 13px;font-size:13px;border-radius:99px;color:var(--tx2);cursor:pointer;font-weight:500}
  .lng-mobile-display a.ac{background:var(--grnA);color:var(--grn)}
  .theme-tg{padding:6px 8px}
}
@media(min-width:901px){.lng-mobile-display{display:none}}

/* HERO */
.hr{padding:64px 0 48px;text-align:center;position:relative;overflow:hidden}
.hr-decorative{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.hr-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 14s ease-in-out infinite}
.hr-blob-1{width:340px;height:340px;background:radial-gradient(var(--grn),transparent 70%);top:-80px;left:8%;animation-delay:0s}
.hr-blob-2{width:280px;height:280px;background:radial-gradient(var(--blu),transparent 70%);top:30px;right:6%;animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-30px) scale(1.1)}}
.hr-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center top,black,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at center top,black,transparent 70%)}
.hr>.w{position:relative;z-index:1}
.hr-bdg{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:var(--grnA);border:1px solid rgba(46,207,144,.22);border-radius:99px;font-size:12.5px;font-weight:600;color:var(--grn);letter-spacing:.6px;margin-bottom:22px;animation:fadeUp .8s ease-out}
.hr-bdg::before{content:'';width:6px;height:6px;background:var(--grn);border-radius:50%;animation:pl 1.5s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes mirPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
@keyframes mirGlow{0%,100%{box-shadow:0 0 0 0 var(--grnA)}50%{box-shadow:0 0 0 8px transparent}}
.hr h1{font-size:clamp(32px,5.5vw,58px);font-weight:900;line-height:1.12;letter-spacing:-.7px;margin-bottom:20px;max-width:820px;margin-left:auto;margin-right:auto;animation:fadeUp 1s ease-out .1s both}
.hr h1 em{font-style:normal;background:linear-gradient(135deg,var(--grn),var(--blu));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hr>.w>p{font-size:17.5px;color:var(--tx2);max-width:660px;margin:0 auto 32px;line-height:1.7;animation:fadeUp 1s ease-out .2s both}
.hb{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp 1s ease-out .3s both}

/* HERO STATS */
.hr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:760px;margin:48px auto 0;animation:fadeUp 1s ease-out .4s both}
.hs-card{padding:20px 22px;background:rgba(11,16,25,.55);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:var(--r2);transition:.25s}
.hs-card:hover{border-color:rgba(46,207,144,.32);transform:translateY(-2px)}
.hs-num{font-family:'Inter',sans-serif;font-size:32px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--grn),var(--blu));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.hs-lbl{font-size:12.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:600}
@media(max-width:640px){.hr-stats{grid-template-columns:repeat(2,1fr);gap:10px}.hs-card{padding:14px 12px}.hs-num{font-size:24px}}
/* === BUTTONS === */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:var(--r);font-size:15px;font-weight:600;letter-spacing:-.01em;transition:transform var(--ts),box-shadow var(--ts),background var(--ts),border-color var(--ts);border:1px solid transparent;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap;line-height:1;position:relative;overflow:hidden}
.bt:active{transform:translateY(0) scale(.98)}
.bt-g{background:linear-gradient(135deg,var(--grn),var(--grn2));color:#06121d;box-shadow:0 4px 14px rgba(46,207,144,.25),inset 0 1px 0 rgba(255,255,255,.1);font-weight:700}
.bt-g:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(46,207,144,.35),inset 0 1px 0 rgba(255,255,255,.15);filter:brightness(1.05)}
.bt-o{background:var(--bg2);color:var(--tx);border-color:var(--bd2)}
.bt-o:hover{background:var(--bg3);border-color:var(--bd3);transform:translateY(-1px)}
.bt-v{background:linear-gradient(135deg,var(--vio),var(--vio2));color:#fff;box-shadow:0 4px 14px rgba(167,139,250,.25);font-weight:700}
.bt-v:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(167,139,250,.4)}
.bt-b{background:var(--blu);color:#fff;font-weight:600}
.bt-b:hover{background:var(--blu2);transform:translateY(-1px)}
[data-theme="light"] .bt-g{color:#fff}

/* TICKER */
.tk-w{margin:48px auto 0;max-width:1080px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:18px}
.tk-l{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin-bottom:14px;font-weight:600}
.live-dot{width:7px;height:7px;background:var(--grn);border-radius:50%;animation:pl 1.5s infinite;display:inline-block;margin-right:6px}
.tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.ti{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;cursor:pointer;transition:.2s}
.ti:hover{border-color:var(--bd2);transform:translateY(-1px)}
.ti-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.ti-nfo{flex:1;min-width:0}
.ti-nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-nm small{color:var(--tx3);font-weight:500;margin-left:4px;font-size:12px}
.ti-pr{font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:600}
.ti-ch{font-size:12px;font-weight:700;text-align:right;font-family:'JetBrains Mono',monospace}
.ti-ch.up{color:var(--grn)}
.ti-ch.dn{color:var(--red)}

/* COIN DETAIL PAGE */
.coin-hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px;padding:22px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2)}
.coin-ic{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;font-family:'Inter',sans-serif}
.coin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cs-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.cs-l{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:5px}
.cs-v{font-size:16.5px;font-weight:700;font-family:'JetBrains Mono',monospace}

/* MARKETS — TradingView tabs */
.mk-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.mk-tab{flex:1 1 100px;min-width:100px;padding:9px 14px;background:transparent;border:none;color:var(--tx2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mk-tab:hover{background:var(--bg3);color:var(--tx)}
.mk-tab.ac{background:var(--grnA);color:var(--grn)}
@media(max-width:680px){
  .mk-tab{font-size:12.5px;padding:8px 10px;flex:0 0 auto;min-width:80px}
  .mk-tabs{padding:5px}
}
/* TradingView container — fix overflow on all devices */
#tvContainer{overflow:hidden;width:100%}
#tvContainer .tradingview-widget-container{width:100%!important;max-width:100%!important;overflow-x:auto;-webkit-overflow-scrolling:touch}
#tvContainer .tradingview-widget-container iframe{width:100%!important;max-width:100%!important;border:none}
@media(max-width:768px){
  #tvContainer{padding:8px!important;min-height:auto!important}
  #tvContainer .tradingview-widget-container{height:480px!important}
  #tvContainer .tradingview-widget-container iframe{height:480px!important}
}

/* MARKETS TABLE (legacy, may be reused) */
.mk-tbl{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden}
.mk-hd,.mk-row{display:grid;grid-template-columns:50px 1.6fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:13px 18px;font-size:13.5px}
.mk-hd{background:var(--bg3);font-size:12px;text-transform:uppercase;letter-spacing:1.1px;font-weight:700;color:var(--tx3);border-bottom:1px solid var(--bd)}
.mk-row{cursor:pointer;border-bottom:1px solid var(--bd);transition:.15s}
.mk-row:hover{background:var(--bg3)}
.mk-row:last-child{border-bottom:none}
@media(max-width:700px){
  .mk-hd,.mk-row{grid-template-columns:30px 1.4fr 1fr 0.9fr;gap:8px;padding:11px 14px;font-size:12.5px}
  .mk-hd>span:nth-child(5),.mk-hd>span:nth-child(6),.mk-row>span:nth-child(5),.mk-row>span:nth-child(6){display:none}
}

/* SECTIONS */
.sc{padding:64px 0;border-top:1px solid var(--bd)}
.sh{text-align:center;margin-bottom:42px}
.sl{font-size:12.5px;text-transform:uppercase;letter-spacing:2.2px;font-weight:700;margin-bottom:12px;display:inline-flex;align-items:center;gap:8px;justify-content:center;color:var(--grn)}
.sh h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.4px;margin-bottom:12px}
.sd{font-size:16px;color:var(--tx2);max-width:620px;margin:0 auto;line-height:1.7}

/* EXCHANGE GRID */
.eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.ec{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:28px 24px;transition:transform var(--tm),box-shadow var(--tm),border-color var(--tm);position:relative;cursor:pointer;overflow:hidden}
.ec::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent,var(--grnA));opacity:0;transition:opacity var(--tm);pointer-events:none}
.ec:hover{transform:translateY(-4px);border-color:var(--bd3);box-shadow:var(--sh-md)}
.ec:hover::before{opacity:1}
.etg{position:absolute;top:-10px;right:18px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;letter-spacing:.5px}
.eic{width:50px;height:50px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-bottom:16px;font-family:'Inter',sans-serif}
.en{font-size:21px;font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.esu{font-size:13px;color:var(--tx3);margin-bottom:14px}
.ef{list-style:none;margin-bottom:18px}
.ef li{font-size:14px;color:var(--tx2);padding:7px 0;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;gap:8px;line-height:1.55}
.ef li:last-child{border:none}
.ck{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;flex-shrink:0;margin-top:2px}
.eb{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:9px;font-weight:600;font-size:14px;text-align:center}
.rebate-tag{display:inline-block;padding:3px 10px;font-size:12px;font-weight:700;border-radius:99px;margin-top:8px;font-family:'JetBrains Mono',monospace}
.mir-card:hover{border-color:var(--bd2)!important;background:var(--bg2)!important;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.15)}

/* TOP EXCHANGE CARDS - Affiliate first */
.top-ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:8px}
.top-ex-card{background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r2);padding:24px;position:relative;transition:.25s;display:flex;flex-direction:column}
.top-ex-card:hover{transform:translateY(-3px);border-color:var(--ec,var(--grn));box-shadow:0 12px 30px -8px var(--ec,rgba(46,207,144,.4))}
.top-ex-best{border-color:var(--ec,var(--grn));box-shadow:0 6px 24px -6px var(--ec,rgba(46,207,144,.32))}
.top-ex-best-tag{position:absolute;top:-12px;left:24px;background:linear-gradient(135deg,#ffb547,#f59e0b);color:#0a0c14;padding:5px 14px;border-radius:99px;font-size:12.5px;font-weight:800;letter-spacing:.4px;box-shadow:0 4px 14px rgba(255,181,71,.4)}
.top-ex-h{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top-ex-logo{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.top-ex-n{font-size:18px;font-weight:800;margin:0 0 3px}
.top-ex-s{font-size:13.5px;color:var(--tx2);margin:0;line-height:1.5}
.top-ex-rebate-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;padding:14px;background:var(--bg3);border-radius:10px}
.top-ex-rebate-box{text-align:center}
.top-ex-rebate-l{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:4px}
.top-ex-rebate-v{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1.1}
.top-ex-code-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:9px 12px;background:var(--bg);border:1px dashed var(--bd2);border-radius:8px}
.top-ex-code-l{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.top-ex-code-v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;flex:1}
.top-ex-code-cp{background:transparent;border:none;cursor:pointer;font-size:14px;padding:4px 8px;border-radius:5px;transition:.15s;color:var(--tx2)}
.top-ex-code-cp:hover{background:var(--bg3);color:var(--tx)}
.top-ex-actions{display:flex;gap:8px;margin-top:auto}
.top-ex-go{flex:1;font-weight:700;font-size:14.5px;padding:12px;justify-content:center}
.top-ex-detail{padding:12px 16px;font-size:13px}

/* WHY US */
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.why-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:24px}
.why-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.why-card h3{font-size:16.5px;font-weight:700;margin:0 0 10px}
.why-card p{font-size:13.5px;color:var(--tx2);line-height:1.65;margin:0}

/* COMPARISON TABLE */
.cmp-table-wrap{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;overflow-x:auto}
.cmp-table{width:100%;border-collapse:collapse;min-width:640px}
.cmp-table th{background:var(--bg3);text-align:left;padding:14px 18px;font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700;border-bottom:1px solid var(--bd)}
.cmp-table td{padding:16px 18px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}
.cmp-table tbody tr{transition:.15s}
.cmp-table tbody tr:hover{background:var(--bg3)}
.cmp-table tbody tr:last-child td{border-bottom:none}

/* FINAL CTA */
.fin-cta{background:linear-gradient(135deg,var(--grnA),rgba(93,160,255,.10));border:1px solid var(--grn);border-radius:var(--r2);padding:36px 32px;text-align:center;position:relative;overflow:hidden}
.fin-cta::before{content:"";position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,var(--grnA) 0%,transparent 60%);pointer-events:none}
.fin-cta h2{font-size:26px;margin:0 0 10px;position:relative}
.fin-cta p{font-size:15px;color:var(--tx2);max-width:560px;margin:0 auto 24px;line-height:1.7;position:relative}
.fin-cta-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:780px;margin:0 auto;position:relative}
.fin-cta-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:11px;cursor:pointer;transition:.2s;text-align:left;color:var(--tx);font-family:inherit}
.fin-cta-btn:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 8px 20px -6px var(--c)}
.fin-cta-logo{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.fin-cta-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.fin-cta-name{font-size:14.5px;font-weight:700}
.fin-cta-rebate{font-size:12.5px;font-weight:600;font-family:'JetBrains Mono',monospace}
.fin-cta-arrow{font-size:18px;color:var(--tx3);transition:.2s}
.fin-cta-btn:hover .fin-cta-arrow{color:var(--c);transform:translateX(3px)}

/* ARTICLE GRID */
.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}

(function(){

// This catches stale SWs that may have been registered in old versions.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    for(var i=0;i<rs.length;i++)rs[i].unregister();
  }).catch(function(){});
}
// Clear old caches if any leaked through
if('caches' in window){
  caches.keys().then(function(ks){
    for(var i=0;i<ks.length;i++)caches.delete(ks[i]);
  }).catch(function(){});
}
// SPA URL fix — runs IMMEDIATELY on page load (before main script).
// Handles 3 cases:
// 1. 404.html redirected with ?p=/path → restore /path
// 2. URL has trailing slash → strip it
// 3. Legacy hash URL like /#/markets → convert to /markets
(function(){
  try{
    var search=location.search||'';
    var pathname=location.pathname||'/';
    // Case 1: ?p= redirect from 404.html
    if(search.indexOf('p=')!==-1||search.indexOf('p%3D')!==-1){
      var params=new URLSearchParams(search);
      var p=params.get('p');
      if(p){
        // Decode (URLSearchParams already decodes once, but handle double-encode)
        try{if(p.indexOf('%2F')!==-1)p=decodeURIComponent(p)}catch(e){}
        if(p.charAt(0)!=='/')p='/'+p;
        p=p.replace(/^\/+/,'/');
        if(p!=='/'&&p.charAt(p.length-1)==='/')p=p.slice(0,-1);
        history.replaceState({},'',p);
        return;
      }
    }
    // Case 2: trailing slash on non-root
    if(pathname!=='/'&&pathname.charAt(pathname.length-1)==='/'){
      history.replaceState({},'',pathname.slice(0,-1)+search+(location.hash||''));
      return;
    }
    // Case 3: hash-based legacy URL
    if(location.hash&&location.hash.length>1&&pathname==='/'){
      var hp=location.hash.slice(1);
      if(hp.charAt(0)==='/')hp=hp.slice(1);
      if(hp)history.replaceState({},'','/'+hp);
    }
  }catch(e){console.warn('URL fix failed:',e)}
})();
</script>

const cn=s=>T[lang].coin_names?.[s]||s;

const pL=o=>{
  if(!o)return'';
  if(typeof o==='string')return o.replace(/\{YEAR\}/g,netYear());
  const v=o[lang]||o.zh||o.en||Object.values(o).find(v=>v)||'';

// Filter for visible articles: published + not future-dated + has title
const isVisible=a=>{
  if(!a)return false;
  // Auto-publish if scheduled time has passed (handles cold-loaded articles too)
  if(a.scheduledAt&&!a.pub){
    const t=new Date(a.scheduledAt).getTime();
    if(!isNaN(t)&&t<=Date.now()+NET_OFFSET){
      a.pub=1;a.scheduledAt=null;
    }
  }
  if(!a.pub)return false;
  if(!pL(a.title))return false;
  if(a.date){
    const today=netNow().toISOString().slice(0,10);
    if(a.date>today)return false;
  }
  return true;
};

// NETWORK TIME (3-source fallback, multiple intervals)
// ═══════════════════════════════════════════════════════════════
let NET_OFFSET=0;
let LAST_RENDERED_YEAR=null;
let LAST_RENDERED_DAY=null;
async function syncTime(){
  const sources=[
    {u:'https://www.okx.com/api/v5/public/time',p:r=>parseInt(r.data?.[0]?.ts)},
    {u:'https://worldtimeapi.org/api/timezone/Etc/UTC',p:r=>new Date(r.utc_datetime).getTime()},
    {u:'https://timeapi.io/api/Time/current/zone?timeZone=UTC',p:r=>new Date(r.dateTime+'Z').getTime()}
  ];
  for(const s of sources){
    try{
      const t0=Date.now();
      const r=await fetch(s.u,{cache:'no-store'});
      if(!r.ok)continue;
      const d=await r.json();
      const ms=s.p(d);
      if(!ms||isNaN(ms))continue;
      NET_OFFSET=ms+(Date.now()-t0)/2-Date.now();
      checkDateChange();
      return true;
    }catch(e){}
  }
  // All sources failed — use local time (NET_OFFSET stays 0)
  checkDateChange();
  return false;
}
function netNow(){return new Date(Date.now()+NET_OFFSET)}
function netYear(){return netNow().getUTCFullYear()}
function netDay(){const d=netNow();return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate()}

// Update all year displays without re-rendering
function updYear(){
  const y=netYear();
  document.querySelectorAll('[data-year]').forEach(el=>el.textContent=y);
  LAST_RENDERED_YEAR=y;
}

// Detect date change and re-render if year flipped (or for safety, daily refresh)
function checkDateChange(){
  const day=netDay();
  const year=netYear();
  if(LAST_RENDERED_DAY===null){LAST_RENDERED_DAY=day;LAST_RENDERED_YEAR=year;updYear();return}
  // Day changed — re-render whole app to refresh all {YEAR} placeholders, dates in FAQ, etc.
  if(day!==LAST_RENDERED_DAY){
    LAST_RENDERED_DAY=day;
    LAST_RENDERED_YEAR=year;
    rr(); // full re-render to pick up new year in all translated strings
  }
}
window.addEventListener('load',()=>{
  syncTime();
  // Re-sync from network every 30 minutes
  setInterval(syncTime,30*60*1000);
  // Check date locally every 60 seconds (catches day rollover even if network is offline)
  setInterval(checkDateChange,60*1000);
  // Also re-check when tab becomes visible (user came back after being away)
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){checkDateChange();syncTime()}
  });
});

// Copy text to clipboard with visual feedback
function copyTxt(t,btn){
  const fb=v=>{if(btn){const orig=btn.textContent;btn.textContent=v?'✓':'✗';btn.style.color=v?'var(--grn)':'var(--red)';setTimeout(()=>{btn.textContent=orig;btn.style.color=''},1200)}};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>fb(true)).catch(()=>fb(false));
  }else{
    // Fallback for older browsers
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');fb(true)}catch{fb(false)}
    document.body.removeChild(ta);
  }
}
// Navigate to a path (no hash). Uses pushState for back/forward support.
function go(p){
  let path=(p||'').replace(/^\/+/,'').replace(/\/+$/,'');
  const url=path?'/'+path:'/';
  // Avoid pushing duplicate state
  if(location.pathname!==url){
    history.pushState({},'',url);
  }
  rr();
  window.scrollTo(0,0);
}

function gr(){
  // On Cloudflare Pages: always use pathname (no hash needed)
  // _redirects ensures every URL gets index.html with 200 OK
  let path=location.pathname||'/';
  // Strip leading/trailing slashes for parsing
  path=path.replace(/^\/+/,'').replace(/\/+$/,'');
  // Legacy hash fallback (for any old bookmarks /#/route)
  if(!path&&location.hash&&location.hash.length>1){
    let hp=location.hash.slice(1);
    if(hp.startsWith('/'))hp=hp.slice(1);
    path=hp.replace(/\/+$/,'');
  }
  if(!path)return{p:'home'};
  const s=path.split('/').filter(Boolean);
  // Route table (order matters — most specific first)
  if(s[0]==='go'&&s[1])return{p:'go',id:s[1]};
  if(s[0]==='exchange'&&s[1])return{p:'exch',id:s[1]};
  if(s[0]==='exchanges'||s[0]==='exchange')return{p:'exs'};
  if(s[0]==='article'&&s[1]){
    const v=s[1];
    if(/^\d+$/.test(v))return{p:'art',id:+v};
    return{p:'art',slug:v};
  }
  if(s[0]==='articles')return{p:'arts'};
  if(s[0]==='coin'&&s[1])return{p:'coin',id:s[1]};
  if(s[0]==='markets'||s[0]==='market')return{p:'mkts'};
  if(s[0]==='guides'||s[0]==='guide')return{p:'guides'};
  if(s[0]==='disclosure')return{p:'disc'};
  if(s[0]==='about')return{p:'about'};
  if(s[0]==='register-bonus'||s[0]==='bonus')return{p:'bonus'};
  if(s[0]==='access-urls'||s[0]==='access'||s[0]==='mirrors')return{p:'access'};
  return{p:'home'};
}

// Update <link rel=canonical> dynamically per page (helps SEO)
function updCanonical(r){
  let url='https://cryptorebatehub.com/';
  const map={exs:'exchanges',guides:'guides',disc:'disclosure',about:'about',arts:'articles',mkts:'markets',bonus:'register-bonus',access:'access-urls'};
  if(r.p==='exch'&&r.id)url+='exchange/'+r.id;
  else if(r.p==='coin'&&r.id)url+='coin/'+r.id;
  else if(r.p==='art'){
    const a=findArt(r);if(a)url+=artUrl(a);
  }
  else if(map[r.p])url+=map[r.p];
  // Set canonical
  let c=document.querySelector('link[rel="canonical"]');
  if(!c){c=document.createElement('link');c.rel='canonical';document.head.appendChild(c)}
  c.href=url;
  // og:url
  let ou=document.querySelector('meta[property="og:url"]');
  if(ou)ou.content=url;
  // twitter:url
  let tu=document.querySelector('meta[name="twitter:url"]');
  if(!tu){tu=document.createElement('meta');tu.setAttribute('name','twitter:url');document.head.appendChild(tu)}
  tu.content=url;
  // hreflang alternates: per-language URL hints (Google uses these for region targeting)
  const langs=['zh-CN','zh-TW','en','ko','x-default'];
  langs.forEach(hl=>{
    let l=document.querySelector('link[rel="alternate"][hreflang="'+hl+'"]');
    if(!l){l=document.createElement('link');l.rel='alternate';l.hreflang=hl;document.head.appendChild(l)}
    l.href=url;
  });
  // Inject route-specific Schema.org structured data
  injectRouteSchema(r,url);
}

  function addSchema(obj){
    const s=document.createElement('script');
    s.type='application/ld+json';s.setAttribute('data-route-schema','');
    s.textContent=JSON.stringify(obj);
    document.head.appendChild(s);
  }
  const langCode=lang==='zh'?'zh-CN':lang;
  const home='https://cryptorebatehub.com/';

  if(r.p==='exs'){

    const items=D.exs.filter(e=>!e.hidden).slice(0,5).map((e,i)=>({

      "name":pL(e.name)||e.id,
      "url":home+'exchange/'+e.id,

    }));

    addSchema({
      "@context":"https://schema.org",
      "@type":"FinancialProduct",
      "@id":url+'#product',
      "name":exName,
      "alternateName":r.id==='okx'?['OKX','欧易','OKEX']:r.id==='binance'?['Binance','币安','幣安']:r.id==='bybit'?['Bybit','BYBIT']:[exName],
      "description":pL(ex.sub)||(exName+' crypto exchange — registration guide and rebate'),

      "provider":{"@type":"Organization","name":exName,"url":ex.url||url},

    addSchema({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":tr('nav_home'),"item":home},{"@type":"ListItem","position":2,"name":tr('nav_ex'),"item":home+'exchanges'},{"@type":"ListItem","position":3,"name":exName,"item":url}]});
  }else if(r.p==='coin'&&r.id){
    const sym=r.id.toUpperCase();
    const cname=cn(r.id+'-USDT')||sym;
    const schema={
      "@context":"https://schema.org",
      "@type":"FinancialProduct",
      "name":cname+' ('+sym+')',
      "description":cname+' real-time price, charts, and market data',
      "url":url,
      "category":"Cryptocurrency",
      "inLanguage":lang==='zh'?'zh-CN':lang
    };
    const s=document.createElement('script');
    s.type='application/ld+json';s.setAttribute('data-route-schema','');
    s.textContent=JSON.stringify(schema);
    document.head.appendChild(s);
    const bc={
      "@context":"https://schema.org",
      "@type":"BreadcrumbList",
      "itemListElement":[
        {"@type":"ListItem","position":1,"name":tr('nav_home'),"item":"https://cryptorebatehub.com/"},
        {"@type":"ListItem","position":2,"name":tr('nav_market'),"item":"https://cryptorebatehub.com/markets"},
        {"@type":"ListItem","position":3,"name":cname+' ('+sym+')',"item":url}

    const bs=document.createElement('script');
    bs.type='application/ld+json';bs.setAttribute('data-route-schema','');
    bs.textContent=JSON.stringify(bc);
    document.head.appendChild(bs);
  }
  // BreadcrumbList for all other static pages
  const staticPageMap={
    mkts:{n:'nav_market'},guides:{n:'nav_guides'},

// MARKDOWN PARSER (proper UL/OL handling, XSS-safe)
// ═══════════════════════════════════════════════════════════════
function md2h(m){
  if(!m)return'';
  m=es(m);
  const lines=m.split('\n');
  const out=[];let inUl=false,inOl=false,inPre=false,para=[],preBuf=[];
  const flush=()=>{if(para.length){out.push('<p>'+para.join(' ')+'</p>');para=[]}};
  const closeUl=()=>{if(inUl){out.push('</ul>');inUl=false}};
  const closeOl=()=>{if(inOl){out.push('</ol>');inOl=false}};
  for(let ln of lines){
    if(ln.startsWith('```')){
      if(inPre){out.push('<pre><code>'+preBuf.join('\n')+'</code></pre>');preBuf=[];inPre=false}
      else{flush();closeUl();closeOl();inPre=true}
      continue;
    }
    if(inPre){preBuf.push(ln);continue}
    const t=ln.trim();
    if(!t){flush();closeUl();closeOl();continue}
    const h3=t.match(/^### (.+)$/),h2=t.match(/^## (.+)$/);
    if(h2||h3){flush();closeUl();closeOl();out.push(h2?'<h2>'+h2[1]+'</h2>':'<h3>'+h3[1]+'</h3>');continue}
    if(t.startsWith('&gt; ')){flush();closeUl();closeOl();out.push('<blockquote>'+t.slice(5)+'</blockquote>');continue}
    if(/^[-*] /.test(t)){flush();closeOl();if(!inUl){out.push('<ul>');inUl=true}out.push('<li>'+t.slice(2)+'</li>');continue}
    if(/^\d+\. /.test(t)){flush();closeUl();if(!inOl){out.push('<ol>');inOl=true}out.push('<li>'+t.replace(/^\d+\. /,'')+'</li>');continue}
    if(t.startsWith('|')&&t.endsWith('|')){
      flush();closeUl();closeOl();
      const cells=t.slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^-+$/.test(c)))continue;
      const isHd=out.length&&out[out.length-1].startsWith('<table>')&&!out[out.length-1].includes('<tr>');
      if(!out.length||!out[out.length-1].startsWith('<table>')){out.push('<table><tr>'+cells.map(c=>'<th>'+c+'</th>').join('')+'</tr>');continue}
      out[out.length-1]+='<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
      continue;
    }
    if(out.length&&out[out.length-1].startsWith('<table>')&&!t.startsWith('|')){
      out[out.length-1]+='</table>';
    }
    closeUl();closeOl();para.push(t);
  }
  flush();closeUl();closeOl();
  if(out.length&&out[out.length-1].startsWith('<table>')&&!out[out.length-1].endsWith('</table>'))out[out.length-1]+='</table>';
  let html=out.join('\n');
  html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
           .replace(/\*([^*\n]+?)\*/g,'<em>$1</em>')
           .replace(/`([^`]+)`/g,'<code>$1</code>');
  return html;
}

function loadTVChart(inst){
  const el=document.getElementById('tvChart');
  if(!el)return;
  // Map our inst (e.g. BTC-USDT) to TradingView format (BINANCE:BTCUSDT)
  const tvSymbol='BINANCE:'+inst.replace('-','');
  const tvLang=lang==='zh'?'zh_CN':lang==='zh-TW'?'zh_TW':lang==='ko'?'kr':'en';
  // Build via DOM (NOT innerHTML with script tag) to avoid HTML parser issues
  el.innerHTML='<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>';
  const ns=document.createElement('script');
  ns.type='text/javascript';
  ns.async=true;
  ns.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
  ns.textContent=JSON.stringify({autosize:true,symbol:tvSymbol,interval:'60',timezone:'Etc/UTC',theme:'dark',style:'1',locale:tvLang,backgroundColor:'rgba(11, 16, 25, 1)',gridColor:'rgba(24, 34, 54, 1)',hide_top_toolbar:false,hide_legend:false,save_image:false,calendar:false,hide_volume:false,support_host:'https://www.tradingview.com'});
  el.querySelector('.tradingview-widget-container').appendChild(ns);
}
async function fpCoin(){
  if(!CP_INST||!document.getElementById('cp-price'))return;
  // Fetch only 24h ticker stats — chart is handled by TradingView
  try{
    const r=await fetch('https://www.okx.com/api/v5/market/ticker?instId='+CP_INST);
    const d=await r.json();
    if(d.data&&d.data[0]){
      const t=d.data[0];
      const price=parseFloat(t.last),open=parseFloat(t.open24h),high=parseFloat(t.high24h),low=parseFloat(t.low24h),vol=parseFloat(t.volCcy24h||t.vol24h);
      const chg=(price/open-1)*100;
      $up('cp-price','$'+fN(price));
      const chEl=document.getElementById('cp-change');
      if(chEl){chEl.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';chEl.style.color=chg>=0?'var(--grn)':'var(--red)'}
      $up('cp-high','$'+fN(high));
      $up('cp-low','$'+fN(low));
      $up('cp-open','$'+fN(open));
      $up('cp-vol',fN(vol));
    }
  }catch(e){console.warn('Coin fetch fail',e)}
}
function $up(id,v){const e=document.getElementById(id);if(e)e.textContent=v}

    "@context":"https://schema.org",
    "@type":isTutorial?"TechArticle":"Article",
    "@id":artPageUrl+'#article',

    "description":metaDesc(pL(a.exc)),
    "datePublished":(a.date||'2026-01-01')+'T00:00:00+08:00',
    "dateModified":(a.date||'2026-01-01')+'T00:00:00+08:00',
    "inLanguage":langCode,
    "url":artPageUrl,

    "publisher":{"@id":"https://cryptorebatehub.com/#organization"},
    "mainEntityOfPage":{"@type":"WebPage","@id":artPageUrl},

    "keywords":pL(a.tag)||a.cat||'crypto',

  };
  const s=document.createElement('script');
  s.type='application/ld+json';s.id='artSchema';

  document.head.appendChild(s);
  // Article-specific BreadcrumbList
  const oldBc=document.getElementById('artBcSchema');if(oldBc)oldBc.remove();
  const bcSchema={
    "@context":"https://schema.org",
    "@type":"BreadcrumbList",
    "itemListElement":[
      {"@type":"ListItem","position":1,"name":tr('nav_home'),"item":"https://cryptorebatehub.com/"},

  };

  bs.type='application/ld+json';bs.id='artBcSchema';
  bs.textContent=JSON.stringify(bcSchema);

}

let CURRENT_CAT='';
function filterByCategory(cat){
  CURRENT_CAT=cat;
  document.querySelectorAll('.cat-chip').forEach(b=>b.classList.toggle('ac',b.dataset.cat===cat));
  filterPublicArts();
}
function filterPublicArts(){
  const q=(document.getElementById('artSearch')?.value||'').toLowerCase().trim();
  let visible=0;
  document.querySelectorAll('#artGrid .ac').forEach(el=>{
    const matchSearch=!q||el.dataset.search.includes(q);
    const matchCat=!CURRENT_CAT||el.dataset.cat===CURRENT_CAT;
    const show=matchSearch&&matchCat;
    el.style.display=show?'':'none';
    if(show)visible++;
  });
  const no=document.getElementById('artNoResult');
  if(no)no.style.display=visible===0?'block':'none';
  const grid=document.getElementById('artGrid');
  if(grid)grid.style.display=visible===0?'none':'';
}

// LANGUAGE SWITCH

function setLang(l){
  if(!T[l])return;
  lang=l;localStorage.setItem('crh_lang',l);
  document.documentElement.lang=l;
  // Don't set title/desc here — rr() handles it via updCanonical/render flow
  document.querySelectorAll('#lngS a').forEach(a=>a.classList.toggle('ac',a.dataset.l===l));
  rr();
}
// Theme toggle (dark/light)
function toggleTheme(){
  const cur=document.documentElement.dataset.theme||'dark';
  const next=cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  localStorage.setItem('crh_theme',next);
  const ic=document.getElementById('themeIc');
  // Show the icon for what the user WOULD switch to (intuitive UX)
  if(ic)ic.textContent=next==='dark'?'☀':'🌙';
}
function applyTheme(){
  const saved=localStorage.getItem('crh_theme')||'dark';
  document.documentElement.dataset.theme=saved;
  const ic=document.getElementById('themeIc');
  if(ic)ic.textContent=saved==='dark'?'☀':'🌙';
}
// Mobile menu toggle (animated)
function toggleMobileMenu(force){
  const nl=document.getElementById('nLinks');
  const bd=document.getElementById('nvBd');
  const tg=document.getElementById('mbTg');
  if(!nl||!bd||!tg)return;
  const opn=typeof force==='boolean'?force:!nl.classList.contains('opn');
  nl.classList.toggle('opn',opn);
  bd.classList.toggle('sh',opn);
  tg.classList.toggle('opn',opn);
  document.body.style.overflow=opn?'hidden':'';
}
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;el.textContent=tr(k)});
  document.querySelectorAll('[data-t-html]').forEach(el=>{const k=el.dataset.tHtml;el.innerHTML=tr(k)});
  document.querySelectorAll('#lngS a').forEach(a=>a.classList.toggle('ac',a.dataset.l===lang));
  // Mobile lang picker
  document.querySelectorAll('#lngMobile a').forEach(a=>{
    const txt=a.textContent.trim();
    const map={'简':'zh','繁':'zh-TW','EN':'en','한':'ko'};
    a.classList.toggle('ac',map[txt]===lang);
  });
}
// Strip HTML, decode entities, truncate for meta description
function metaDesc(s){
  if(!s)return'';
  return s.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/\s+/g,' ').trim().slice(0,160);
}
// Set or create a meta tag (for per-article keywords/og tags)
function setMeta(key,content,attr){
  attr=attr||'name';
  let el=document.querySelector(`meta[${attr}="${key}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,key);document.head.appendChild(el)}
  el.content=content||'';
}
// Article view tracking (localStorage-based, for "Popular Articles" feature)
function trackArticleView(id){
  try{
    const key='crh_views';
    const v=JSON.parse(localStorage.getItem(key)||'{}');
    v[id]=(v[id]||0)+1;
    v[id+'_last']=Date.now();
    localStorage.setItem(key,JSON.stringify(v));
  }catch(e){}
}
function getPopularArticles(limit){
  try{
    const v=JSON.parse(localStorage.getItem('crh_views')||'{}');
    const counts=Object.entries(v)
      .filter(([k])=>!k.endsWith('_last'))
      .map(([id,count])=>({id:+id,count}));
    counts.sort((a,b)=>b.count-a.count);
    return counts.slice(0,limit||5)
      .map(c=>({article:D.arts.find(a=>a.id===c.id&&isVisible(a)),count:c.count}))
      .filter(x=>x.article);
  }catch(e){return[]}
}

// ═══════════════════════════════════════════════════════════════
// LOAD ARTICLES + INIT
// ═══════════════════════════════════════════════════════════════
async function loadData(){
  // Load custom data from localStorage (admin-edited)
  try{
    const saved=localStorage.getItem('crh_d');
    if(saved){const parsed=JSON.parse(saved);D=Object.assign({},DF,parsed)}
  }catch(e){}
  // Load articles from articles.json
  try{
    const r=await fetch('articles.json',{cache:'no-store'});
    if(r.ok){
      const arts=await r.json();
      arts.forEach(a=>{
        if(!a.date){a.date=netYear()+'-01-01'}
        // Default to published if pub field missing
        if(a.pub===undefined)a.pub=1;
      });
      // Merge: don't overwrite admin-saved articles
      if(!D.arts||!D.arts.length)D.arts=arts;
      else{
        const ids=new Set(D.arts.map(a=>a.id));
        arts.forEach(a=>{if(!ids.has(a.id))D.arts.push(a)});
      }
    }
  }catch(e){console.warn('Articles load fail',e)}
}

window.addEventListener('scroll',()=>{document.getElementById('nbar').classList.toggle('sc',window.scrollY>20)});

if(localStorage.getItem('crh_bn')==='x')document.getElementById('indBn').style.display='none';

document.documentElement.lang=lang;
// Apply saved theme before render (avoids flash)
applyTheme();
// URL normalization is now handled in the early bootstrap script (top of <head>) — no need to repeat here
// Initial load: data → render → set active lang button (no double render)
loadData().then(()=>{
  rr();
  document.querySelectorAll('#lngS a').forEach(a=>a.classList.toggle('ac',a.dataset.l===lang));
}).catch(e=>{
  // Even if data load fails, still render so user sees something
  console.warn('Data load failed, rendering anyway:',e);
  try{rr()}catch(e2){console.error('Render failed:',e2)}
});
</script>
