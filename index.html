<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b13;--bg2:#0d131f;--bg3:#141c2b;

  --bd:rgba(255,255,255,.10);--bd2:rgba(255,255,255,.18);
  --grn:#10d8a0;--grn2:#0fb88a;--grnA:rgba(16,216,160,.10);
  --blu:#7ac0ff;--bluA:rgba(122,192,255,.10);
  --gld:#f0b41e;--org:#ff8a3a;--red:#ff5060;--yel:#fbbf24;
  --r:10px;--r2:14px
}
[data-theme="light"]{

  --tx:#0f1420;--tx2:#3a4358;--tx3:#697086;
  --bd:rgba(0,0,0,.10);--bd2:rgba(0,0,0,.18);
  --grn:#008f64;--grn2:#007852;--grnA:rgba(0,143,100,.08);

  --gld:#a07a1a;--org:#c0651a;--red:#c92a3a;--yel:#a07a1a
}
[data-theme="light"] body::before{background:radial-gradient(ellipse at 50% 0%,rgba(0,168,120,.04),transparent 60%)}
[data-theme="light"] .nv{background:rgba(255,255,255,.92) !important}
[data-theme="light"] .nv.sc{background:rgba(255,255,255,.97) !important}
[data-theme="light"] .ind-bn{background:rgba(251,191,36,.12)}

[data-theme="light"] .hr-grid{background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px) !important}
[data-theme="light"] .nl{background:#fafbfc}
.theme-tg{background:none;border:1px solid var(--bd);color:var(--tx2);cursor:pointer;font-size:14px;padding:6px 10px;border-radius:8px;transition:.2s;display:inline-flex;align-items:center;gap:5px}
.theme-tg:hover{border-color:var(--bd2);color:var(--tx)}
html{scroll-behavior:smooth}
body{font-family:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden;font-feature-settings:"cv02","cv03","cv04","cv11"}

/* NAV */
.nv{position:sticky;top:0;z-index:50;background:rgba(7,11,19,.88);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.3s}

.lng{display:flex;gap:4px;font-size:13px;flex-shrink:0}

.lng a:hover,.lng a.ac{background:var(--grnA);color:var(--grn)}
/* Hamburger button — animates to X when open */
.mb-tg{display:none;background:none;border:none;color:var(--tx);cursor:pointer;padding:8px;width:36px;height:36px;position:relative;z-index:51;align-items:center;justify-content:center}
.mb-tg .hb-line{display:block;width:22px;height:2px;background:currentColor;border-radius:2px;transition:.3s;position:relative}
.mb-tg .hb-line::before,.mb-tg .hb-line::after{content:'';position:absolute;left:0;width:22px;height:2px;background:currentColor;border-radius:2px;transition:.3s}
.mb-tg .hb-line::before{top:-7px}
.mb-tg .hb-line::after{top:7px}
.mb-tg.opn .hb-line{background:transparent}
.mb-tg.opn .hb-line::before{top:0;transform:rotate(45deg)}
.mb-tg.opn .hb-line::after{top:0;transform:rotate(-45deg)}
/* Mobile menu backdrop */
.nv-bd{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:47}
.nv-bd.sh{opacity:1;pointer-events:auto}
@media(max-width:900px){
  .nl{position:fixed;top:0;right:-100%;height:100vh;width:84%;max-width:340px;background:var(--bg);flex-direction:column;justify-content:flex-start;padding:80px 18px 24px;transition:right .3s ease;border-left:1px solid var(--bd);z-index:48;box-shadow:-12px 0 40px rgba(0,0,0,.4);overflow-y:auto}
  .nl.opn{right:0}
  .nl a{display:block;padding:14px 18px;font-size:16px;border-radius:10px;margin-bottom:4px;font-weight:500}

  .mb-tg{display:flex}
  .lng{position:fixed;top:-9999px;left:-9999px}

  .lng-mobile-display{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);gap:8px;z-index:49;flex-wrap:wrap;justify-content:center;background:var(--bg2);padding:10px 14px;border-radius:99px;border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .lng-mobile-display a{padding:7px 13px;font-size:13px;border-radius:99px;color:var(--tx2);cursor:pointer;font-weight:500}
  .lng-mobile-display a.ac{background:var(--grnA);color:var(--grn)}
  .theme-tg{padding:6px 8px}
}
@media(min-width:901px){.lng-mobile-display{display:none}}

/* HERO */
.hr{padding:64px 0 48px;text-align:center;position:relative;overflow:hidden}
.hr-decorative{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.hr-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:float 14s ease-in-out infinite}
.hr-blob-1{width:340px;height:340px;background:radial-gradient(var(--grn),transparent 70%);top:-80px;left:8%;animation-delay:0s}
.hr-blob-2{width:280px;height:280px;background:radial-gradient(var(--blu),transparent 70%);top:30px;right:6%;animation-delay:-7s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-30px) scale(1.1)}}
.hr-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center top,black,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at center top,black,transparent 70%)}
.hr>.w{position:relative;z-index:1}
.hr-bdg{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;background:var(--grnA);border:1px solid rgba(16,216,160,.18);border-radius:99px;font-size:12.5px;font-weight:600;color:var(--grn);letter-spacing:.6px;margin-bottom:22px;animation:fadeUp .8s ease-out}
.hr-bdg::before{content:'';width:6px;height:6px;background:var(--grn);border-radius:50%;animation:pl 1.5s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hr h1{font-size:clamp(32px,5.5vw,58px);font-weight:900;line-height:1.12;letter-spacing:-.7px;margin-bottom:20px;max-width:820px;margin-left:auto;margin-right:auto;animation:fadeUp 1s ease-out .1s both}
.hr h1 em{font-style:normal;background:linear-gradient(135deg,var(--grn),var(--blu));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hr>.w>p{font-size:17.5px;color:var(--tx2);max-width:660px;margin:0 auto 32px;line-height:1.7;animation:fadeUp 1s ease-out .2s both}
.hb{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp 1s ease-out .3s both}

/* HERO STATS */
.hr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:760px;margin:48px auto 0;animation:fadeUp 1s ease-out .4s both}

.bt{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:var(--r);font-size:15px;font-weight:600;transition:.2s;border:none;cursor:pointer;font-family:inherit;text-decoration:none}

(function(){

// SPA URL fix — runs IMMEDIATELY on page load (before main script).
// Handles 3 cases:
// 1. 404.html redirected with ?p=/path → restore /path
// 2. URL has trailing slash → strip it
// 3. Legacy hash URL like /#/markets → convert to /markets
(function(){
  try{
    var search=location.search||'';
    var pathname=location.pathname||'/';
    // Case 1: ?p= redirect from 404.html
    if(search.indexOf('p=')!==-1||search.indexOf('p%3D')!==-1){
      var params=new URLSearchParams(search);
      var p=params.get('p');
      if(p){
        // Decode (URLSearchParams already decodes once, but handle double-encode)
        try{if(p.indexOf('%2F')!==-1)p=decodeURIComponent(p)}catch(e){}
        if(p.charAt(0)!=='/')p='/'+p;
        p=p.replace(/^\/+/,'/');
        if(p!=='/'&&p.charAt(p.length-1)==='/')p=p.slice(0,-1);
        history.replaceState({},'',p);
        return;
      }
    }
    // Case 2: trailing slash on non-root
    if(pathname!=='/'&&pathname.charAt(pathname.length-1)==='/'){
      history.replaceState({},'',pathname.slice(0,-1)+search+(location.hash||''));
      return;
    }
    // Case 3: hash-based legacy URL
    if(location.hash&&location.hash.length>1&&pathname==='/'){
      var hp=location.hash.slice(1);
      if(hp.charAt(0)==='/')hp=hp.slice(1);
      if(hp)history.replaceState({},'','/'+hp);
    }
  }catch(e){console.warn('URL fix failed:',e)}
})();
</script>

const cn=s=>T[lang].coin_names?.[s]||s;
// Pick language value AND substitute {YEAR} placeholder at read time

const pL=o=>{
  if(!o)return'';
  if(typeof o==='string')return o.replace(/\{YEAR\}/g,netYear());
  const v=o[lang]||o.zh||o.en||Object.values(o).find(v=>v)||'';

};

// Filter for visible articles: published + not future-dated + has title
const isVisible=a=>{
  if(!a)return false;
  // Auto-publish if scheduled time has passed (handles cold-loaded articles too)
  if(a.scheduledAt&&!a.pub){
    const t=new Date(a.scheduledAt).getTime();
    if(!isNaN(t)&&t<=Date.now()+NET_OFFSET){
      a.pub=1;a.scheduledAt=null;
    }
  }
  if(!a.pub)return false;
  if(!pL(a.title))return false;
  if(a.date){
    const today=netNow().toISOString().slice(0,10);
    if(a.date>today)return false;
  }
  return true;
};

// NETWORK TIME (3-source fallback, multiple intervals)
// ═══════════════════════════════════════════════════════════════
let NET_OFFSET=0;
let LAST_RENDERED_YEAR=null;
let LAST_RENDERED_DAY=null;
async function syncTime(){
  const sources=[
    {u:'https://www.okx.com/api/v5/public/time',p:r=>parseInt(r.data?.[0]?.ts)},
    {u:'https://worldtimeapi.org/api/timezone/Etc/UTC',p:r=>new Date(r.utc_datetime).getTime()},
    {u:'https://timeapi.io/api/Time/current/zone?timeZone=UTC',p:r=>new Date(r.dateTime+'Z').getTime()}
  ];
  for(const s of sources){
    try{
      const t0=Date.now();
      const r=await fetch(s.u,{cache:'no-store'});
      if(!r.ok)continue;
      const d=await r.json();
      const ms=s.p(d);
      if(!ms||isNaN(ms))continue;
      NET_OFFSET=ms+(Date.now()-t0)/2-Date.now();
      checkDateChange();
      return true;
    }catch(e){}
  }
  // All sources failed — use local time (NET_OFFSET stays 0)
  checkDateChange();
  return false;
}
function netNow(){return new Date(Date.now()+NET_OFFSET)}
function netYear(){return netNow().getUTCFullYear()}
function netDay(){const d=netNow();return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate()}

// Update all year displays without re-rendering
function updYear(){
  const y=netYear();
  document.querySelectorAll('[data-year]').forEach(el=>el.textContent=y);
  LAST_RENDERED_YEAR=y;
}

// Detect date change and re-render if year flipped (or for safety, daily refresh)
function checkDateChange(){
  const day=netDay();
  const year=netYear();
  if(LAST_RENDERED_DAY===null){LAST_RENDERED_DAY=day;LAST_RENDERED_YEAR=year;updYear();return}
  // Day changed — re-render whole app to refresh all {YEAR} placeholders, dates in FAQ, etc.
  if(day!==LAST_RENDERED_DAY){
    LAST_RENDERED_DAY=day;
    LAST_RENDERED_YEAR=year;
    rr(); // full re-render to pick up new year in all translated strings
  }
}
window.addEventListener('load',()=>{
  syncTime();
  // Re-sync from network every 30 minutes
  setInterval(syncTime,30*60*1000);
  // Check date locally every 60 seconds (catches day rollover even if network is offline)
  setInterval(checkDateChange,60*1000);
  // Also re-check when tab becomes visible (user came back after being away)
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){checkDateChange();syncTime()}
  });
});

function fN(n){if(!n&&n!==0)return'--';n=parseFloat(n);if(n>=1e3)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=1)return n.toFixed(2);if(n>=0.01)return n.toFixed(4);return n.toFixed(6)}
// Copy text to clipboard with visual feedback
function copyTxt(t,btn){
  const fb=v=>{if(btn){const orig=btn.textContent;btn.textContent=v?'✓':'✗';btn.style.color=v?'var(--grn)':'var(--red)';setTimeout(()=>{btn.textContent=orig;btn.style.color=''},1200)}};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>fb(true)).catch(()=>fb(false));
  }else{
    // Fallback for older browsers
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');fb(true)}catch{fb(false)}
    document.body.removeChild(ta);
  }
}

function gr(){

  let path=location.pathname;
  if(!path||path==='/')path='';
  // Backward compat: if hash exists from old links, prefer it
  if(location.hash&&location.hash.length>1){
    path=location.hash.slice(1);
    if(path.startsWith('/'))path=path.slice(1);
  }else{
    path=path.replace(/^\/+/,'').replace(/\/+$/,'');
  }
  if(!path)return{p:'home'};
  const s=path.split('/').filter(Boolean);
  if(s[0]==='go'&&s[1])return{p:'go',id:s[1]};
  if(s[0]==='exchange'&&s[1])return{p:'exch',id:s[1]};

  if(s[0]==='articles')return{p:'arts'};
  if(s[0]==='coin'&&s[1])return{p:'coin',id:s[1]};
  if(s[0]==='markets')return{p:'mkts'};
  if(s[0]==='article'&&s[1]){
    const v=s[1];
    if(/^\d+$/.test(v))return{p:'art',id:+v};
    return{p:'art',slug:v};
  }
  if(s[0]==='guides')return{p:'guides'};
  if(s[0]==='disclosure')return{p:'disc'};
  if(s[0]==='about')return{p:'about'};
  return{p:'home'};

// Update <link rel=canonical> dynamically per page (helps SEO)
function updCanonical(r){
  let url='https://cryptorebatehub.com/';
  const map={exs:'exchanges',guides:'guides',disc:'disclosure',about:'about',arts:'articles',mkts:'markets',bonus:'register-bonus'};
  if(r.p==='exch'&&r.id)url+='exchange/'+r.id;
  else if(r.p==='coin'&&r.id)url+='coin/'+r.id;
  else if(r.p==='art'){
    const a=findArt(r);if(a)url+=artUrl(a);
  }
  else if(map[r.p])url+=map[r.p];
  // Set canonical
  let c=document.querySelector('link[rel="canonical"]');
  if(!c){c=document.createElement('link');c.rel='canonical';document.head.appendChild(c)}
  c.href=url;
  // og:url
  let ou=document.querySelector('meta[property="og:url"]');
  if(ou)ou.content=url;
  // twitter:url
  let tu=document.querySelector('meta[name="twitter:url"]');
  if(!tu){tu=document.createElement('meta');tu.setAttribute('name','twitter:url');document.head.appendChild(tu)}
  tu.content=url;
  // hreflang alternates: per-language URL hints (Google uses these for region targeting)
  const langs=['zh-CN','zh-TW','en','ko','x-default'];
  langs.forEach(hl=>{
    let l=document.querySelector('link[rel="alternate"][hreflang="'+hl+'"]');
    if(!l){l=document.createElement('link');l.rel='alternate';l.hreflang=hl;document.head.appendChild(l)}
    l.href=url;
  });
  // Inject route-specific Schema.org structured data
  injectRouteSchema(r,url);
}

// MARKDOWN PARSER (proper UL/OL handling, XSS-safe)
// ═══════════════════════════════════════════════════════════════
function md2h(m){
  if(!m)return'';
  m=es(m);
  const lines=m.split('\n');
  const out=[];let inUl=false,inOl=false,inPre=false,para=[],preBuf=[];
  const flush=()=>{if(para.length){out.push('<p>'+para.join(' ')+'</p>');para=[]}};
  const closeUl=()=>{if(inUl){out.push('</ul>');inUl=false}};
  const closeOl=()=>{if(inOl){out.push('</ol>');inOl=false}};
  for(let ln of lines){
    if(ln.startsWith('```')){
      if(inPre){out.push('<pre><code>'+preBuf.join('\n')+'</code></pre>');preBuf=[];inPre=false}
      else{flush();closeUl();closeOl();inPre=true}
      continue;
    }
    if(inPre){preBuf.push(ln);continue}
    const t=ln.trim();
    if(!t){flush();closeUl();closeOl();continue}
    const h3=t.match(/^### (.+)$/),h2=t.match(/^## (.+)$/);
    if(h2||h3){flush();closeUl();closeOl();out.push(h2?'<h2>'+h2[1]+'</h2>':'<h3>'+h3[1]+'</h3>');continue}
    if(t.startsWith('&gt; ')){flush();closeUl();closeOl();out.push('<blockquote>'+t.slice(5)+'</blockquote>');continue}
    if(/^[-*] /.test(t)){flush();closeOl();if(!inUl){out.push('<ul>');inUl=true}out.push('<li>'+t.slice(2)+'</li>');continue}
    if(/^\d+\. /.test(t)){flush();closeUl();if(!inOl){out.push('<ol>');inOl=true}out.push('<li>'+t.replace(/^\d+\. /,'')+'</li>');continue}
    if(t.startsWith('|')&&t.endsWith('|')){
      flush();closeUl();closeOl();
      const cells=t.slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^-+$/.test(c)))continue;
      const isHd=out.length&&out[out.length-1].startsWith('<table>')&&!out[out.length-1].includes('<tr>');
      if(!out.length||!out[out.length-1].startsWith('<table>')){out.push('<table><tr>'+cells.map(c=>'<th>'+c+'</th>').join('')+'</tr>');continue}
      out[out.length-1]+='<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
      continue;
    }
    if(out.length&&out[out.length-1].startsWith('<table>')&&!t.startsWith('|')){
      out[out.length-1]+='</table>';
    }
    closeUl();closeOl();para.push(t);
  }
  flush();closeUl();closeOl();
  if(out.length&&out[out.length-1].startsWith('<table>')&&!out[out.length-1].endsWith('</table>'))out[out.length-1]+='</table>';
  let html=out.join('\n');
  html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
           .replace(/\*([^*\n]+?)\*/g,'<em>$1</em>')
           .replace(/`([^`]+)`/g,'<code>$1</code>');
  return html;
}

async function fpCoin(){
  if(!CP_INST||!document.getElementById('cp-price'))return;
  // Fetch only 24h ticker stats — chart is handled by TradingView
  try{
    const r=await fetch('https://www.okx.com/api/v5/market/ticker?instId='+CP_INST);
    const d=await r.json();
    if(d.data&&d.data[0]){
      const t=d.data[0];
      const price=parseFloat(t.last),open=parseFloat(t.open24h),high=parseFloat(t.high24h),low=parseFloat(t.low24h),vol=parseFloat(t.volCcy24h||t.vol24h);
      const chg=(price/open-1)*100;
      $up('cp-price','$'+fN(price));
      const chEl=document.getElementById('cp-change');
      if(chEl){chEl.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';chEl.style.color=chg>=0?'var(--grn)':'var(--red)'}
      $up('cp-high','$'+fN(high));
      $up('cp-low','$'+fN(low));
      $up('cp-open','$'+fN(open));
      $up('cp-vol',fN(vol));
    }
  }catch(e){console.warn('Coin fetch fail',e)}
}

function injectArticleSchema(a){

  const schema={

    "@type":"Article",
    "headline":pL(a.title),

    "author":{"@type":"Organization","name":"CryptoRebateHub","url":"https://cryptorebatehub.com/"},
    "publisher":{"@id":"https://cryptorebatehub.com/#organization"},
    "mainEntityOfPage":{"@type":"WebPage","@id":artFullUrl(a)},
    "image":"https://cryptorebatehub.com/og-image.png",
    "articleSection":a.cat||'general',
    "keywords":pL(a.tag)||a.cat||'crypto'
  };
  const s=document.createElement('script');
  s.type='application/ld+json';s.id='artSchema';

  const bcSchema={
    "@context":"https://schema.org",

  bs.type='application/ld+json';bs.id='artBcSchema';
  bs.textContent=JSON.stringify(bcSchema);
  document.head.appendChild(bs);
}

let CURRENT_CAT='';
function filterByCategory(cat){
  CURRENT_CAT=cat;
  document.querySelectorAll('.cat-chip').forEach(b=>b.classList.toggle('ac',b.dataset.cat===cat));

}
function filterPublicArts(){
  const q=(document.getElementById('artSearch')?.value||'').toLowerCase().trim();
  let visible=0;
  document.querySelectorAll('#artGrid .ac').forEach(el=>{
    const matchSearch=!q||el.dataset.search.includes(q);
    const matchCat=!CURRENT_CAT||el.dataset.cat===CURRENT_CAT;
    const show=matchSearch&&matchCat;
    el.style.display=show?'':'none';
    if(show)visible++;
  });
  const no=document.getElementById('artNoResult');
  if(no)no.style.display=visible===0?'block':'none';
  const grid=document.getElementById('artGrid');
  if(grid)grid.style.display=visible===0?'none':'';
}

function setLang(l){
  if(!T[l])return;
  lang=l;localStorage.setItem('crh_lang',l);
  document.documentElement.lang=l;
  // Don't set title/desc here — rr() handles it via updCanonical/render flow
  document.querySelectorAll('#lngS a').forEach(a=>a.classList.toggle('ac',a.dataset.l===l));
  rr();
}
// Theme toggle (dark/light)
function toggleTheme(){
  const cur=document.documentElement.dataset.theme||'dark';
  const next=cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  localStorage.setItem('crh_theme',next);
  const ic=document.getElementById('themeIc');
  // Show the icon for what the user WOULD switch to (intuitive UX)
  if(ic)ic.textContent=next==='dark'?'☀':'🌙';
}
function applyTheme(){
  const saved=localStorage.getItem('crh_theme')||'dark';
  document.documentElement.dataset.theme=saved;
  const ic=document.getElementById('themeIc');
  if(ic)ic.textContent=saved==='dark'?'☀':'🌙';
}
// Mobile menu toggle (animated)

  const nl=document.getElementById('nLinks');
  const bd=document.getElementById('nvBd');
  const tg=document.getElementById('mbTg');
  if(!nl||!bd||!tg)return;
  const opn=typeof force==='boolean'?force:!nl.classList.contains('opn');
  nl.classList.toggle('opn',opn);

  tg.classList.toggle('opn',opn);

function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;el.textContent=tr(k)});
  document.querySelectorAll('[data-t-html]').forEach(el=>{const k=el.dataset.tHtml;el.innerHTML=tr(k)});
  document.querySelectorAll('#lngS a').forEach(a=>a.classList.toggle('ac',a.dataset.l===lang));
  // Mobile lang picker
  document.querySelectorAll('#lngMobile a').forEach(a=>{
    const txt=a.textContent.trim();
    const map={'简':'zh','繁':'zh-TW','EN':'en','한':'ko'};
    a.classList.toggle('ac',map[txt]===lang);
  });
}
// Strip HTML, decode entities, truncate for meta description
function metaDesc(s){
  if(!s)return'';
  return s.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/\s+/g,' ').trim().slice(0,160);
}
// Set or create a meta tag (for per-article keywords/og tags)
function setMeta(key,content,attr){
  attr=attr||'name';
  let el=document.querySelector(`meta[${attr}="${key}"]`);
  if(!el){el=document.createElement('meta');el.setAttribute(attr,key);document.head.appendChild(el)}
  el.content=content||'';
}
// Article view tracking (localStorage-based, for "Popular Articles" feature)
function trackArticleView(id){
  try{
    const key='crh_views';
    const v=JSON.parse(localStorage.getItem(key)||'{}');
    v[id]=(v[id]||0)+1;
    v[id+'_last']=Date.now();
    localStorage.setItem(key,JSON.stringify(v));
  }catch(e){}
}
function getPopularArticles(limit){
  try{
    const v=JSON.parse(localStorage.getItem('crh_views')||'{}');
    const counts=Object.entries(v)
      .filter(([k])=>!k.endsWith('_last'))
      .map(([id,count])=>({id:+id,count}));
    counts.sort((a,b)=>b.count-a.count);
    return counts.slice(0,limit||5)
      .map(c=>({article:D.arts.find(a=>a.id===c.id&&isVisible(a)),count:c.count}))
      .filter(x=>x.article);
  }catch(e){return[]}
}

// ═══════════════════════════════════════════════════════════════
// LOAD ARTICLES + INIT
// ═══════════════════════════════════════════════════════════════
async function loadData(){
  // Load custom data from localStorage (admin-edited)
  try{
    const saved=localStorage.getItem('crh_d');
    if(saved){const parsed=JSON.parse(saved);D=Object.assign({},DF,parsed)}
  }catch(e){}
  // Load articles from articles.json
  try{
    const r=await fetch('articles.json',{cache:'no-store'});
    if(r.ok){
      const arts=await r.json();
      arts.forEach(a=>{
        if(!a.date){a.date=netYear()+'-01-01'}
        // Default to published if pub field missing
        if(a.pub===undefined)a.pub=1;
      });
      // Merge: don't overwrite admin-saved articles
      if(!D.arts||!D.arts.length)D.arts=arts;
      else{
        const ids=new Set(D.arts.map(a=>a.id));
        arts.forEach(a=>{if(!ids.has(a.id))D.arts.push(a)});
      }
    }
  }catch(e){console.warn('Articles load fail',e)}
}

window.addEventListener('scroll',()=>{document.getElementById('nbar').classList.toggle('sc',window.scrollY>20)});

if(localStorage.getItem('crh_bn')==='x')document.getElementById('indBn').style.display='none';

document.documentElement.lang=lang;

applyTheme();
// URL normalization is now handled in the early bootstrap script (top of <head>) — no need to repeat here
// Initial load: data → render → set active lang button (no double render)
loadData().then(()=>{
  rr();
  document.querySelectorAll('#lngS a').forEach(a=>a.classList.toggle('ac',a.dataset.l===lang));
}).catch(e=>{
  // Even if data load fails, still render so user sees something
  console.warn('Data load failed, rendering anyway:',e);
  try{rr()}catch(e2){console.error('Render failed:',e2)}
});
</script>
